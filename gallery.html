<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Gallery</title>

    <link rel="stylesheet"
    href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <!-- NAVBAR -->

    <nav>

        <div class="logo">

            <i class="fa-solid fa-school"></i>

            Sunrise School

        </div>

        <ul>

            <li><a href="index.html">Home</a></li>

            <li><a href="about.html">About</a></li>

            <li><a href="academics.html">Academics</a></li>

            <li><a href="gallery.html">Gallery</a></li>

            <li><a href="contact.html">Contact</a></li>

        </ul>

        <button class="login-btn">
            Student Login
        </button>

    </nav>

    <!-- PAGE BANNER -->

    <section class="page-banner">

        <h1>School Gallery</h1>

    </section>

    <!-- GALLERY SECTION -->

    <section class="gallery-container">

        <div class="gallery-box">

            <img src="https://images.unsplash.com/photo-1509062522246-3755977927d7"
            alt="School">

        </div>

        <div class="gallery-box">

            <img src="https://images.unsplash.com/photo-1523050854058-8df90110c9f1"
            alt="Students">

        </div>

        <div class="gallery-box">

            <img src="https://images.unsplash.com/photo-1588072432836-e10032774350"
            alt="Classroom">

        </div>

        <div class="gallery-box">

            <img src="https://images.unsplash.com/photo-1577896851231-70ef18881754"
            alt="Library">

        </div>

        <div class="gallery-box">

            <img src="https://images.unsplash.com/photo-1513258496099-48168024aec0"
            alt="Sports">

        </div>

        <div class="gallery-box">

            <img src="https://images.unsplash.com/photo-1503676260728-1c00da094a0b"
            alt="Students">

        </div>

    </section>

    <!-- CHATBOT BUTTON -->

    <div class="chatbot-button">

        <i class="fa-solid fa-robot"></i>

    </div>

    <!-- CHAT WINDOW -->

    <div class="chat-window" id="chatWindow">

        <div class="chat-header">

            <h3>School Chatbot</h3>

            <span id="closeChat">

                <i class="fa-solid fa-xmark"></i>

            </span>

        </div>

        <div class="chat-body" id="chatBody">

            <div class="bot-message">

                Hii 👋 <br>
                How can I help you?

            </div>

        </div>

        <div class="chat-input">

            <input type="text"
            id="userInput"
            placeholder="Type message...">

            <button id="sendBtn">

                <i class="fa-solid fa-paper-plane"></i>

            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
